<svg xmlns="http://www.w3.org/2000/svg" width="2420" height="1390" viewBox="0 0 2420 1390" role="img" aria-labelledby="variants-title variants-desc">
  <title id="variants-title">MetaUNETR variant comparison and verified Mamba placement</title>
  <desc id="variants-desc">Three aligned rows compare the exact metaunetr_mamba, mod_a, and mod_b selectors. Every row shares the same four-channel input, encoder widths and depths, five skips, decoder scales, and three-channel raw-logit head. The baseline places TriCruciMamba3D in the bottleneck, Mod A places it in encoder stages, and Mod B places it in four coarse decoder refinement blocks while keeping the final decoder CNN-only. A lower panel shows CrossScan3D axis sequence shapes and the shared training contract. The figure explicitly labels the local CPU fallback and avoids any claim of official Mamba-3 MIMO behavior.</desc>
  <style><![CDATA[
    .canvas { fill: #f4f1eb; }
    .panel { fill: #fffdf8; stroke: #c9d0cd; stroke-width: 2; }
    .table-header { fill: #172329; stroke: #172329; stroke-width: 2; }
    .variant-cell { fill: #f2e5ea; stroke: #c995a9; stroke-width: 2; }
    .encoder-cell { fill: #f8fbfa; stroke: #9bbdb8; stroke-width: 2; }
    .bottleneck-cell { fill: #ebe8f3; stroke: #aaa3c8; stroke-width: 2; }
    .decoder-cell { fill: #fff9ef; stroke: #d2ad79; stroke-width: 2; }
    .head-cell { fill: #e8e9e6; stroke: #aeb7b4; stroke-width: 2; }
    .shared-strip { fill: #e6eef4; stroke: #99b4c7; stroke-width: 2; }
    .scan-card { fill: #f8fbfa; stroke: #9bbdb8; stroke-width: 2; }
    .training-card { fill: #fff9ef; stroke: #d2ad79; stroke-width: 2; }
    .scan-box { fill: #e1efec; stroke: #8fbab4; stroke-width: 2; }
    .active-mamba { fill: #f2e5ea; stroke: #96526d; stroke-width: 2; }
    .active-cnn { fill: #e8f0e2; stroke: #4e753d; stroke-width: 2; }
    .inactive { fill: #e8e9e6; stroke: #aeb7b4; stroke-width: 2; }
    .mamba-chip { fill: #96526d; stroke: #96526d; }
    .cnn-chip { fill: #4e753d; stroke: #4e753d; }
    .identity-chip { fill: #667276; stroke: #667276; }
    .dark-callout { fill: #172329; }
    .title { fill: #172329; font-family: Georgia, 'Times New Roman', serif; font-size: 42px; font-weight: 700; letter-spacing: -0.8px; }
    .subtitle { fill: #526064; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 18px; }
    .kicker { fill: #655a91; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2.4px; }
    .panel-label { fill: #172329; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 1.8px; }
    .panel-note { fill: #667276; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 14px; }
    .header-cell { fill: #fffdf8; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; }
    .row-title { fill: #172329; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 16px; font-weight: 700; }
    .row-subtitle { fill: #526064; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 13px; }
    .body { fill: #28373d; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 14px; }
    .body-small { fill: #526064; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 12px; }
    .body-bold { fill: #1d2c31; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; }
    .mono { fill: #1d2c31; font-family: 'Courier New', Courier, monospace; font-size: 12px; }
    .mono-small { fill: #526064; font-family: 'Courier New', Courier, monospace; font-size: 11px; }
    .pill-text { fill: #fffdf8; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }
    .tag-text { fill: #fffdf8; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .mini-label { fill: #667276; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    .white-body { fill: #fffdf8; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 12px; }
    .white-mono { fill: #fffdf8; font-family: 'Courier New', Courier, monospace; font-size: 13px; }
    .rule { stroke: #b9c2bf; stroke-width: 1.5; }
    .flow { fill: none; stroke: #24343a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
