defaults:
  - experiment: mod_a
  - run: full
  - _self_

command: benchmark
runtime: benchmark
device: cuda

paths:
  data_root: ${hydra:runtime.cwd}/data/cloud/brats
  image_root: ${hydra:runtime.cwd}/data/cloud/imagenet
  output_root: ${hydra:runtime.cwd}/outputs
  experiment_output: ${paths.output_root}/${runtime}/${experiment.name}/${run.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  checkpoint_dir: ${paths.experiment_output}/checkpoints
  manifest: ${hydra:runtime.cwd}/data/manifests/brats_seed42.json

tracking:
  enabled: true
  mode: online
  project: token-mixer-placement-matters
  entity: aniekanetimudo
  group: token-mixer-brats-seed42
  job_type: benchmark
  run_name: null
  log_images: false
  directory: ${paths.output_root}/wandb

efficiency:
  enabled: true
  nvml:
    enabled: true
    device_index: 0
    sample_interval_seconds: 0.25
  profiler:
    enabled: true
    mac_tool: thop
    flop_tool: fvcore

benchmark:
  source_checkpoint: null
  source_artifact: null
  source_train_run_id: null
  protocol: auto
  input_shape: null
  warmup_iterations: 20
  repetitions: 100
  batch_sizes: [1, 2, 4, 8]
  case_limit: null
  output_name: benchmark.json

hydra:
  run:
    dir: ${paths.experiment_output}
  job:
    chdir: false
