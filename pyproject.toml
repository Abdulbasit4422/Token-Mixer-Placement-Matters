[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-mixer-placement-matters"
version = "0.1.0"
description = "Research pipeline for token mixer placement in medical image segmentation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch",
    "torchvision",
    "wandb",
    "jupytext",
    "hydra-core",
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "pyyaml",
    "requests>=2.31",
    "ipykernel>=7.2.0",
    "kaggle>=2.2.4",
]

[project.optional-dependencies]
# Install with: uv sync --extra imaging
imaging = [
    "monai",
    "einops",
    "nibabel",
    "SimpleITK",
]
research = [
    "timm",
    "ml-collections",
]
dev = [
    "jupyterlab==4.4.1",
    "jupyter-collaboration==4.0.2",
    "jupyter-mcp-tools",
    "pycrdt",
    "pytest",
    "pre-commit",
    "jupyterlab_cell_status_extension",
]

[tool.jupytext]
formats = "ipynb,py:percent"
outdated_text_notebook_margin = 130

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/token_mixer"]
